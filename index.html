<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文本阅读器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{height:100vh;overflow:hidden;background:#fff;}

#topBar{
  position:absolute;
  top:8px;
  left:8px;
  right:8px;
  z-index:10;
  display:flex;
  flex-direction:column;
  gap:8px;
  align-items:flex-start;
}
#pageInfo{
  position:absolute;
  top:10px;
  right:12px;
  z-index:11;
  font-size:14px;
  color:#444;
  background:rgba(255,255,255,0.85);
  padding:2px 6px;
  border-radius:4px;
}

.row-item{
  display:flex;
  gap:6px;
  align-items:center;
}

#textContainer{
  width:100vw;
  height:calc(100vh - 60px);
  padding:76px 16px 16px 16px;
  overflow:auto;
}
.line{
  white-space:pre;
  font-family:monospace;
}

#btnBar{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:50px;
  display:flex;
  justify-content:center;
  gap:24px;
  align-items:center;
  background:#f8f8f8;
  border-top:1px solid #ccc;
  z-index:10;
}
button{
  padding:6px 18px;
  font-size:15px;
  cursor:pointer;
}
button:disabled{
  cursor:not-allowed;
  opacity:0.5;
}
input[type="number"]{
  width:70px;
  padding:4px;
}
</style>
</head>
<body>
<div id="topBar">
  <div class="row-item">
    <input type="file" id="fileInput" accept=".txt">
  </div>
  <div class="row-item">
    <label>每页行数:</label>
    <input type="number" id="linesPerPageInput" value="5000" min="1">
    <button id="applyLinesBtn">应用</button>
  </div>
</div>
<div id="pageInfo"></div>
<div id="textContainer"></div>
<div id="btnBar">
  <button id="btnPrev">上一页</button>
  <button id="btnNext">下一页</button>
  <button id="btnSavePage">保存本页</button>
</div>

<script>
let LINES_PER_PAGE = 5000;
let allLines = [];
let currentPage = 0;
let totalPage = 0;
let originFileName = ""; // 保存原始文件名

const fileInput = document.getElementById('fileInput');
const textContainer = document.getElementById('textContainer');
const pageInfo = document.getElementById('pageInfo');
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
const btnSavePage = document.getElementById('btnSavePage');
const linesPerPageInput = document.getElementById('linesPerPageInput');
const applyLinesBtn = document.getElementById('applyLinesBtn');

fileInput.onchange = async e=>{
  const f = e.target.files[0];
  if(!f)return;
  originFileName = f.name.replace(/\.txt$/i,""); // 去掉后缀
  const txt = await f.text();
  allLines = txt.split(/\r?\n/);
  // 移除文件末尾换行造成的多余空行，文本中间空行保留
  while(allLines.length > 0 && allLines.at(-1) === ""){
    allLines.pop();
  }
  currentPage = 0;
  recalcPage();
  render();
};

applyLinesBtn.onclick = ()=>{
  const val = parseInt(linesPerPageInput.value,10);
  if(!Number.isInteger(val) || val <1) return;
  // 保存当前阅读行位置，切换每页行数不跳回首页
  const currentLineIndex = currentPage * LINES_PER_PAGE;
  LINES_PER_PAGE = val;
  currentPage = Math.floor(currentLineIndex / LINES_PER_PAGE);
  recalcPage();
  render();
};

function recalcPage(){
  totalPage = allLines.length>0 ? Math.ceil(allLines.length / LINES_PER_PAGE) : 0;
}

function render(){
  textContainer.innerHTML = '';
  const s = currentPage * LINES_PER_PAGE;
  const e = s + LINES_PER_PAGE;
  const slice = allLines.slice(s,e);
  for(const line of slice){
    const div = document.createElement('div');
    div.className = "line";
    div.textContent = line;
    textContainer.appendChild(div);
  }

  if(totalPage>0){
    const endLine = Math.min(e, allLines.length);
    pageInfo.textContent = `${currentPage+1}/${totalPage} | ${s+1}‑${endLine}行`;
  }else{
    pageInfo.textContent = '未加载文件';
  }

  btnPrev.disabled = currentPage <= 0;
  btnNext.disabled = currentPage >= totalPage - 1;
  btnSavePage.disabled = totalPage <=0; // 没有文件时保存按钮禁用
}

// 保存当前页下载
btnSavePage.onclick = ()=>{
  if(totalPage <= 0) return;
  const s = currentPage * LINES_PER_PAGE;
  const e = s + LINES_PER_PAGE;
  const slice = allLines.slice(s,e);
  const pageText = slice.join("\r\n");

  // 文件名：原始文件名_第N页_共M页.txt
  const saveName = `${originFileName}_${currentPage+1}_${totalPage}.txt`;

  const blob = new Blob([pageText], {type:"text/plain;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = saveName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
};

btnPrev.onclick = ()=>{
  if(currentPage>0){
    currentPage--;
    render();
  }
};
btnNext.onclick = ()=>{
  if(currentPage < totalPage-1){
    currentPage++;
    render();
  }
};
</script>
</body>
</html>
