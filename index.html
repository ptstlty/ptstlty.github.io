<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>固定5000行阅读器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{height:100vh;overflow:hidden;background:#fff;}
#fileInput{position:absolute;top:8px;left:8px;z-index:10}
#textContainer{
  width:100vw;height:100vh;
  padding:16px;
  overflow:auto;
}
.line{
  white-space:pre;
  font-family:monospace;
}
</style>
</head>
<body>
<input type="file" id="fileInput" accept=".txt">
<div id="textContainer"></div>

<script>
const LINES_PER_PAGE = 5000;
let allLines = [];
let currentPage = 0;
const fileInput = document.getElementById('fileInput');
const textContainer = document.getElementById('textContainer');

fileInput.onchange = async e=>{
  const f = e.target.files[0];
  if(!f)return;
  const txt = await f.text();
  allLines = txt.split(/\r?\n/);
  currentPage = 0;
  render();
};

function render(){
  textContainer.innerHTML = ''; //清空
  const s = currentPage * LINES_PER_PAGE;
  const e = s + LINES_PER_PAGE;
  const slice = allLines.slice(s,e);
  for(const line of slice){
    const div = document.createElement('div');
    div.className = "line";
    div.textContent = line;
    textContainer.appendChild(div);
  }
}

//点击区域：左半屏上一页，右半屏下一页
document.body.onclick = ev=>{
  const w = window.innerWidth;
  const x = ev.clientX;
  const totalPage = Math.ceil(allLines.length / LINES_PER_PAGE);
  if(x < w*0.45){
    if(currentPage>0){ currentPage--; render(); }
  }else if(x> w*0.55){
    if(currentPage < totalPage-1){ currentPage++; render(); }
  }
}
</script>
</body>
</html>
