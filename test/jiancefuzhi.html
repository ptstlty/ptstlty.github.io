<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wechat Translate Detect Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    padding:24px;
    font-family:system-ui,monospace;
    background:#fff;
}
#textWrap{
    white-space:pre-wrap;
    font-size:16px;
    line-height:1.6;
    border:1px solid #ccc;
    padding:16px;
    border-radius:8px;
    max-width:700px;
}
/* 提示toast样式 */
#transToast{
    position:fixed;
    bottom:90px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.78);
    color:#fff;
    padding:10px 18px;
    border-radius:8px;
    z-index:9999;
    display:none;
}
#copyTranslateBtn{
    position:fixed;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    z-index:9999;
    padding:8px 20px;
    font-size:15px;
    display:none;
    cursor:pointer;
}
</style>
</head>
<body>

<div id="textWrap">
Life is a journey, not a destination.
We should enjoy every moment along the way.
Keep curiosity and keep moving forward.
Do not fear difficulties and setbacks.
Every effort you make will pay off someday.
</div>

<div id="transToast"></div>
<button id="copyTranslateBtn">复制翻译后的文本</button>

<script>
const textWrap = document.getElementById('textWrap');
const transToast = document.getElementById('transToast');
const copyTranslateBtn = document.getElementById('copyTranslateBtn');

let observer = null;
let debounceTimer = null;
let hasDetectedTranslate = false;

// 判断是否微信内置浏览器
function isWeChatBrowser(){
    return /micromessenger/i.test(navigator.userAgent);
}

// 显示toast提示
function showToast(msg){
    transToast.textContent = msg;
    transToast.style.display = "block";
    setTimeout(()=>{
        transToast.style.display = "none";
    }, 2800);
}

// 复制文本，兼容微信旧版本
async function copyText(text){
    if(!text) return;
    try{
        await navigator.clipboard.writeText(text);
        showToast("✅复制译文成功");
    }catch(err){
        // 降级方案
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast("✅复制译文成功(兼容模式)");
    }
}

// 启动翻译监听
function startWatchTranslate(){
    if(!isWeChatBrowser()) return;
    if(observer) observer.disconnect();
    hasDetectedTranslate = false;
    copyTranslateBtn.style.display = "none";

    observer = new MutationObserver(()=>{
        if(hasDetectedTranslate) return;

        if(debounceTimer) clearTimeout(debounceTimer);
        debounceTimer = setTimeout(()=>{
            hasDetectedTranslate = true;
            showToast("📢检测到微信全文翻译已完成");
            copyTranslateBtn.style.display = "block"; //显示复制按钮
            observer.disconnect();
        }, 600);
    });

    observer.observe(textWrap,{
        subtree:true,
        characterData:true,
        childList:true
    });
}

// 点击复制按钮：读取DOM中翻译后的内容
copyTranslateBtn.addEventListener('click',async ()=>{
    const translatedContent = textWrap.textContent;
    await copyText(translatedContent);
});

window.addEventListener('load',()=>{
    startWatchTranslate();
});

// 页面卸载清理
window.addEventListener('beforeunload',()=>{
    if(observer) observer.disconnect();
    if(debounceTimer) clearTimeout(debounceTimer);
});
</script>

</body>
</html>
