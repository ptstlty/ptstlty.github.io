
<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Text Reader</title>

<style>

*{margin:0;padding:0;box-sizing:border-box}

body{height:100vh;overflow:hidden;background:#fff;}

#topBar{

  position:absolute;

  top:8px;

  left:8px;

  right:8px;

  z-index:10;

  display:flex;

  flex-direction:column;

  gap:8px;

  align-items:flex-start;

}

#pageInfo{

  position:absolute;

  top:10px;

  right:12px;

  z-index:11;

  font-size:14px;

  color:#444;

  background:rgba(255,255,255,0.85);

  padding:2px 6px;

  border-radius:4px;

}

.row-item{

  display:flex;

  gap:6px;

  align-items:center;

}

#textContainer{

  width:100vw;

  height:calc(100vh - 60px);

  padding:76px 16px 16px 16px;

  overflow:auto;

}

.line{

  white-space:pre;

  font-family:monospace;

}

#btnBar{

  position:fixed;

  bottom:0;

  left:0;

  width:100%;

  height:50px;

  display:flex;

  justify-content:center;

  gap:12px;

  align-items:center;

  background:#f8f8f8;

  border-top:1px solid #ccc;

  z-index:10;

}

button{

  padding:6px 12px;

  font-size:14px;

  cursor:pointer;

}

button:disabled{

  cursor:not-allowed;

  opacity:0.5;

}

input[type="number"]{

  width:70px;

  padding:4px;

}

/* toast提示 */
#transToast{
    position:fixed;
    bottom:60px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.78);
    color:#fff;
    padding:10px 18px;
    border-radius:8px;
    z-index:9999;
    display:none;
}

</style>

</head>

<body>

<div id="topBar">

  <div class="row-item">

    <input type="file" id="fileInput" accept=".txt">

  </div>

  <div class="row-item">

    <label>Lines per page:</label>

    <input type="number" id="linesPerPageInput" value="5000" min="1">

    <button id="applyLinesBtn">apply</button>

  </div>
  <div class="row-item">
    <button id="autoLoopBtn">启动【翻译‑复制‑自动翻页】循环</button>
  </div>

</div>

<div id="pageInfo"></div>

<div id="textContainer"></div>

<div id="btnBar">

  <button id="btnPrev">Prev page</button>

  <button id="btnNext">Next page</button>

</div>

<div id="transToast"></div>

<script>

let LINES_PER_PAGE = 5000;

let allLines = [];

let currentPage = 0;

let totalPage = 0;

const fileInput = document.getElementById('fileInput');

const textContainer = document.getElementById('textContainer');

const pageInfo = document.getElementById('pageInfo');

const btnPrev = document.getElementById('btnPrev');

const btnNext = document.getElementById('btnNext');

const linesPerPageInput = document.getElementById('linesPerPageInput');

const applyLinesBtn = document.getElementById('applyLinesBtn');

const transToast = document.getElementById('transToast');
const autoLoopBtn = document.getElementById('autoLoopBtn');

// =========微信翻译检测变量========
let observer = null;
let debounceTimer = null;
let ignoreMutation = false;
let pageOriginText = "";
let originViewChineseRatio = 0; //本页原始可视区域中文占比

// 自动循环模式
let autoLoopMode = false;
let autoLoopTimeout = null;
const AUTO_WAIT_TIMEOUT = 20000;
let waitingTranslate = false;
const CHINESE_RATIO_THRESHOLD = 0.90;

function isWeChatBrowser(){
    return /micromessenger/i.test(navigator.userAgent);
}

function showToast(msg){
    transToast.textContent = msg;
    transToast.style.display = "block";
    setTimeout(()=>{
        transToast.style.display = "none";
    },2500);
}

async function copyText(text){
    if(!text) return false;
    try{
        await navigator.clipboard.writeText(text);
        return true;
    }catch(err){
        showToast("❌环境不支持自动复制，请手动复制");
        return false;
    }
}

function isDomTranslated(){
    return !!textContainer.querySelector('[data-trans]');
}

//计算文本中文占比
function getChineseRatio(text){
    if(!text) return 0;
    const allChars = text.replace(/\s/g,'');
    if(allChars.length === 0) return 0;
    const cnMatches = allChars.match(/[\u4e00‑\u9fa5]/g);
    const cnCount = cnMatches ? cnMatches.length : 0;
    return cnCount / allChars.length;
}

/**
 * 获取【屏幕可视区域内】所有.line元素的文本
 */
function getViewportVisibleText(){
    const lines = textContainer.querySelectorAll('.line');
    let visibleText = '';
    const containerRect = textContainer.getBoundingClientRect();
    for(let el of lines){
        const rect = el.getBoundingClientRect();
        // 判断元素是否在容器可视范围内
        if(rect.bottom > containerRect.top && rect.top < containerRect.bottom){
            visibleText += el.textContent + "\n";
        }
    }
    return visibleText;
}

// 关闭自动循环模式
function stopAutoLoop(){
    autoLoopMode = false;
    waitingTranslate = false;
    autoLoopBtn.textContent = "启动【翻译‑复制‑自动翻页】循环";
    if(autoLoopTimeout){
        clearTimeout(autoLoopTimeout);
        autoLoopTimeout = null;
    }
    btnPrev.disabled = false;
    btnNext.disabled = false;
}

function goNextPageAuto(){
    if(currentPage >= totalPage -1){
        showToast("✅全部页面处理完毕，退出自动循环");
        stopAutoLoop();
        return;
    }
    currentPage++;
    render();
    waitingTranslate = true;
    autoLoopTimeout = setTimeout(()=>{
        showToast("⚠️等待翻译超时，退出自动循环");
        stopAutoLoop();
    },AUTO_WAIT_TIMEOUT);
}

//启动监听
function startWatchTranslate(){
    if(!isWeChatBrowser()) return;
    if(observer) observer.disconnect();

    observer = new MutationObserver(()=>{
        if(ignoreMutation || !waitingTranslate) return;

        if(debounceTimer) clearTimeout(debounceTimer);
        debounceTimer = setTimeout(async ()=>{
            if(ignoreMutation || !waitingTranslate) return;

            const visibleText = getViewportVisibleText();
            const viewRatio = getChineseRatio(visibleText);
            const hasTransAttr = isDomTranslated();

            console.log(`可视区中文占比:${(viewRatio*100).toFixed(1)}% |原始可视占比:${(originViewChineseRatio*100).toFixed(1)}%`);

            // 保护：原始可视区中文本来就很高，只认data‑trans标记，避免原始中文误触发
            let triggerOk = false;
            if(originViewChineseRatio >= 0.7){
                triggerOk = hasTransAttr;
            }else{
                triggerOk = hasTransAttr || (viewRatio >= CHINESE_RATIO_THRESHOLD);
            }

            if(!triggerOk){
                return;
            }

            ignoreMutation = true;
            waitingTranslate = false;
            if(autoLoopTimeout) clearTimeout(autoLoopTimeout);

            const fullText = textContainer.textContent;
            const ok = await copyText(fullText);
            if(ok){
                showToast(`✅可视区中文${(viewRatio*100).toFixed(1)}%，译文已复制`);
                if(autoLoopMode){
                    showToast("⏩800ms后自动跳转下一页");
                    setTimeout(()=>{
                        goNextPageAuto();
                    },800);
                }
            }else{
                showToast("❌复制失败，停止自动循环");
                stopAutoLoop();
            }

            if(window.getSelection){
                window.getSelection().removeAllRanges();
            }
            setTimeout(()=>{
                ignoreMutation = false;
            },600);

        },900);
    });

    observer.observe(textContainer,{
        subtree:true,
        characterData:true,
        childList:true,
        attributes:true
    });
}

function stopWatchTranslate(){
    if(observer) observer.disconnect();
    if(debounceTimer) {
        clearTimeout(debounceTimer);
        debounceTimer = null;
    }
}
// =====================================

fileInput.onchange = async e=>{
  stopAutoLoop();
  const f = e.target.files[0];
  if(!f)return;
  const txt = await f.text();
  allLines = txt.split(/\r?\n/);
  while(allLines.length > 0 && allLines.at(-1) === ""){
    allLines.pop();
  }
  currentPage = 0;
  recalcPage();
  render();
};

applyLinesBtn.onclick = ()=>{
  stopAutoLoop();
  const val = parseInt(linesPerPageInput.value,10);
  if(!Number.isInteger(val) || val <1) return;
  const currentLineIndex = currentPage * LINES_PER_PAGE;
  LINES_PER_PAGE = val;
  currentPage = Math.floor(currentLineIndex / LINES_PER_PAGE);
  recalcPage();
  render();
};

autoLoopBtn.onclick = ()=>{
    if(!allLines.length){
        showToast("⚠️请先加载txt文件");
        return;
    }
    if(autoLoopMode){
        stopAutoLoop();
        showToast("已关闭自动循环");
    }else{
        autoLoopMode = true;
        waitingTranslate = true;
        autoLoopBtn.textContent = "停止自动循环";
        btnPrev.disabled = true;
        btnNext.disabled = true;
        showToast("🚀已开启，请手动触发微信翻译");
        autoLoopTimeout = setTimeout(()=>{
            showToast("⚠️等待翻译超时，退出自动循环");
            stopAutoLoop();
        },AUTO_WAIT_TIMEOUT);
    }
};

function recalcPage(){
  totalPage = allLines.length>0 ? Math.ceil(allLines.length / LINES_PER_PAGE) : 0;
}

function render(){
  stopWatchTranslate();
  textContainer.innerHTML = '';

  const s = currentPage * LINES_PER_PAGE;
  const e = s + LINES_PER_PAGE;
  const slice = allLines.slice(s,e);

  for(const line of slice){
    const div = document.createElement('div');
    div.className = "line";
    div.textContent = line;
    textContainer.appendChild(div);
  }

  pageOriginText = textContainer.textContent;
  //渲染完原始页面，采集【屏幕可视区域】原始中文占比
  const initVisible = getViewportVisibleText();
  originViewChineseRatio = getChineseRatio(initVisible);

  if(totalPage>0){
    const endLine = Math.min(e, allLines.length);
    pageInfo.textContent = `${currentPage+1}/${totalPage} | ${s+1}‑${endLine}Lines`;
  }else{
    pageInfo.textContent = 'File not loaded';
  }

  btnPrev.disabled = autoLoopMode || (currentPage <= 0);
  btnNext.disabled = autoLoopMode || (currentPage >= totalPage - 1);

  if(autoLoopMode){
      waitingTranslate = true;
  }else{
      waitingTranslate = false;
  }

  startWatchTranslate();
}

btnPrev.onclick = ()=>{
    stopAutoLoop();
    if(currentPage>0){
        currentPage--;
        render();
    }
};

btnNext.onclick = ()=>{
    stopAutoLoop();
    if(currentPage < totalPage-1){
        currentPage++;
        render();
    }
};

window.addEventListener('beforeunload',()=>{
    stopWatchTranslate();
    stopAutoLoop();
});

</script>

</body>
</html>
