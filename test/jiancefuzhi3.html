<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wechat Translate Detect Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    padding:24px;
    font-family:system-ui,monospace;
    background:#fff;
}
#textWrap{
    white-space:pre-wrap;
    font-size:16px;
    line-height:1.6;
    border:1px solid #ccc;
    padding:16px;
    border-radius:8px;
    max-width:700px;
}
#transToast{
    position:fixed;
    bottom:90px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.78);
    color:#fff;
    padding:10px 18px;
    border-radius:8px;
    z-index:9999;
    display:none;
}
#copyTranslateBtn{
    position:fixed;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    z-index:9999;
    padding:8px 20px;
    font-size:15px;
    display:none;
    cursor:pointer;
}
</style>
</head>
<body>

<div id="textWrap">
Life is a journey, not a destination.
We should enjoy every moment along the way.
Keep curiosity and keep moving forward.
Do not fear difficulties and setbacks.
Every effort you make will pay off someday.
</div>

<div id="transToast"></div>
<button id="copyTranslateBtn">复制翻译后的文本</button>

<script>
const textWrap = document.getElementById('textWrap');
const transToast = document.getElementById('transToast');
const copyTranslateBtn = document.getElementById('copyTranslateBtn');

let observer = null;
let debounceTimer = null;
let ignoreMutation = false; //复制时临时屏蔽监听
const originText = textWrap.textContent.trim();

function isWeChatBrowser(){
    return /micromessenger/i.test(navigator.userAgent);
}

function showToast(msg){
    transToast.textContent = msg;
    transToast.style.display = "block";
    setTimeout(()=>{
        transToast.style.display = "none";
    }, 2800);
}

// 只使用标准clipboard API，移除select+execCommand降级，避免产生文本选区触发微信翻译
async function copyText(text){
    if(!text) return;
    try{
        await navigator.clipboard.writeText(text);
        showToast("✅复制译文成功");
    }catch(err){
        showToast("❌当前环境复制不可用，请手动复制页面文字");
    }
    // 清除页面全部选区，消除微信翻译扫描诱因
    if(window.getSelection){
        window.getSelection().removeAllRanges();
    }
}

function startWatchTranslate(){
    if(!isWeChatBrowser()) return;
    if(observer) observer.disconnect();
    copyTranslateBtn.style.display = "none";

    observer = new MutationObserver(()=>{
        if(ignoreMutation) return; //复制操作期间直接忽略所有DOM变动

        if(debounceTimer) clearTimeout(debounceTimer);
        debounceTimer = setTimeout(()=>{
            const currentText = textWrap.textContent.trim();
            if(currentText === originText){
                copyTranslateBtn.style.display = "none";
            }else{
                copyTranslateBtn.style.display = "block";
            }
        }, 600);
    });

    observer.observe(textWrap,{
        subtree:true,
        characterData:true,
        childList:true
    });
}

copyTranslateBtn.addEventListener('click',async ()=>{
    ignoreMutation = true; //点击复制瞬间屏蔽监听
    const translatedContent = textWrap.textContent;
    await copyText(translatedContent);
    setTimeout(()=>{
        ignoreMutation = false; //复制完成放开监听
    },800);
});

window.addEventListener('load',()=>{
    startWatchTranslate();
});

window.addEventListener('beforeunload',()=>{
    if(observer) observer.disconnect();
    if(debounceTimer) clearTimeout(debounceTimer);
});
</script>

</body>
</html>
