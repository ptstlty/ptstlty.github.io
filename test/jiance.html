<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wechat Translate Detect Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    padding:24px;
    font-family:system-ui,monospace;
    background:#fff;
}
#textWrap{
    white-space:pre-wrap;
    font-size:16px;
    line-height:1.6;
    border:1px solid #ccc;
    padding:16px;
    border-radius:8px;
    max-width:700px;
}
/* 提示toast样式 */
#transToast{
    position:fixed;
    bottom:40px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.78);
    color:#fff;
    padding:10px 18px;
    border-radius:8px;
    z-index:9999;
    display:none;
}
</style>
</head>
<body>

<div id="textWrap">
Life is a journey, not a destination.
We should enjoy every moment along the way.
Keep curiosity and keep moving forward.
Do not fear difficulties and setbacks.
Every effort you make will pay off someday.
</div>

<div id="transToast"></div>

<script>
const textWrap = document.getElementById('textWrap');
const transToast = document.getElementById('transToast');

let observer = null;
let debounceTimer = null;
let hasDetectedTranslate = false;

// 判断是否微信内置浏览器
function isWeChatBrowser(){
    return /micromessenger/i.test(navigator.userAgent);
}

// 显示提示toast
function showTranslateTip(){
    transToast.textContent = "📢检测到微信全文翻译已完成";
    transToast.style.display = "block";
    setTimeout(()=>{
        transToast.style.display = "none";
    }, 2800);
}

// 启动翻译监听
function startWatchTranslate(){
    if(!isWeChatBrowser()) return;
    if(observer) observer.disconnect();
    hasDetectedTranslate = false;

    observer = new MutationObserver(()=>{
        if(hasDetectedTranslate) return;

        // 防抖：等待DOM不再变动，判定翻译完成
        if(debounceTimer) clearTimeout(debounceTimer);
        debounceTimer = setTimeout(()=>{
            hasDetectedTranslate = true;
            showTranslateTip();
            observer.disconnect(); //翻译检测完成，停止监听
        }, 600);
    });

    observer.observe(textWrap,{
        subtree:true,
        characterData:true,
        childList:true
    });
}

window.addEventListener('load',()=>{
    startWatchTranslate();
});

// 页面卸载清理
window.addEventListener('beforeunload',()=>{
    if(observer) observer.disconnect();
    if(debounceTimer) clearTimeout(debounceTimer);
});
</script>

</body>
</html>
